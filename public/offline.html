<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4de">
<title>Koin — Offline</title>
<style>
  :root { --bg: #fff4de; --card: #ffffff; --text: #1e1b18; --muted: #5a5148; --line: #1e1b18; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15121d; --card: #2b2638; --text: #fff4de; --muted: #c2b8ab; --line: #050407; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { max-width: 380px; width: 100%; text-align: center; background: var(--card); border: 3px solid var(--line);
    border-radius: 26px; box-shadow: 6px 6px 0 var(--line); padding: 32px 24px; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); font-weight: 700; line-height: 1.5; }
  button { height: 50px; padding: 0 24px; border-radius: 16px; border: 3px solid #1e1b18; background: #c8f031; color: #1e1b18;
    font: inherit; font-weight: 800; font-size: 16px; box-shadow: 4px 4px 0 var(--line); cursor: pointer; }
  button:active { transform: translate(4px, 4px); box-shadow: none; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icon.svg?v=koin" width="88" height="88" alt="">
    <h1>Kamu sedang offline</h1>
    <p>Koin butuh internet untuk menampilkan data terbarumu. Coba lagi setelah sinyal kembali, ya!</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
